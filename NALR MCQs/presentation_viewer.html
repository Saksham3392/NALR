<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Presentation Viewer — NALR Masterclass</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #090d16;
      --bar-bg: rgba(15, 23, 42, 0.94);
      --border: rgba(255, 255, 255, 0.12);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-ppt: #d24726;
      --accent-ppt-hover: #ea580c;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top Navigation Bar */
    .viewer-navbar {
      height: 56px;
      background: var(--bar-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      gap: 12px;
      flex-shrink: 0;
      z-index: 20;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .btn-nav-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 750;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.18s ease;
      white-space: nowrap;
    }

    .btn-nav-back:hover {
      background: rgba(255, 255, 255, 0.16);
      transform: translateX(-2px);
    }

    .ppt-title-group {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
    }

    .ppt-logo-icon {
      width: 26px;
      height: 26px;
      flex-shrink: 0;
    }

    .ppt-title-text {
      font-size: 15px;
      font-weight: 850;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 380px;
    }

    .ppt-badge {
      font-size: 10.5px;
      font-weight: 800;
      text-transform: uppercase;
      background: rgba(210, 71, 38, 0.2);
      border: 1px solid rgba(210, 71, 38, 0.45);
      color: #fb923c;
      padding: 2.5px 8px;
      border-radius: 999px;
      white-space: nowrap;
    }

    /* Right Action Controls */
    .nav-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-action-view {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
      color: var(--text-main);
      height: 33px;
      padding: 0 13px;
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 750;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.18s ease;
      white-space: nowrap;
    }

    .btn-action-view:hover {
      background: rgba(255, 255, 255, 0.18);
      color: #ffffff;
    }

    .btn-download-ppt {
      background: linear-gradient(135deg, rgba(210, 71, 38, 0.25), rgba(234, 88, 12, 0.25));
      border-color: rgba(234, 88, 12, 0.45);
      color: #fdba74;
    }

    .btn-download-ppt:hover {
      background: linear-gradient(135deg, rgba(210, 71, 38, 0.45), rgba(234, 88, 12, 0.45));
      border-color: var(--accent-ppt-hover);
      color: #ffffff;
    }

    /* Pre-Built Document Viewer Stage */
    .viewer-stage {
      flex: 1;
      width: 100%;
      height: calc(100vh - 56px);
      position: relative;
      background: #525659;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .document-viewer-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #525659;
    }
  </style>
</head>
<body>

  <!-- Top Navigation Bar -->
  <header class="viewer-navbar">
    <div class="nav-left">
      <button class="btn-nav-back" id="btnCloseViewer" onclick="window.close(); if(!window.closed) window.history.back();" title="Close Presentation Viewer">
        ← Back
      </button>

      <div class="ppt-title-group">
        <svg class="ppt-logo-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="2" y="2" width="20" height="20" rx="4.5" fill="#D24726"/>
          <rect x="11" y="5" width="10" height="14" rx="2" fill="#E86C45" opacity="0.9"/>
          <path d="M7 6.5H12C13.6569 6.5 15 7.84315 15 9.5C15 11.1569 13.6569 12.5 12 12.5H8.8V17.5H7V6.5ZM8.8 8.1V10.9H11.8C12.5732 10.9 13.2 10.2732 13.2 9.5C13.2 8.7268 12.5732 8.1 11.8 8.1H8.8Z" fill="white"/>
        </svg>
        <span class="ppt-title-text" id="navbarTitle">Presentation</span>
        <span class="ppt-badge" id="lblSlideBadge">Document Viewer</span>
      </div>
    </div>

    <!-- Right Controls -->
    <div class="nav-right">
      <button class="btn-action-view" id="btnFullscreen" title="Toggle Fullscreen">
        ⛶ Fullscreen
      </button>
      <a href="#" class="btn-action-view btn-download-ppt" id="btnDownload" download title="Download Presentation PDF">
        📥 Download PDF
      </a>
    </div>
  </header>

  <!-- Pre-Built Viewer Stage Area -->
  <main class="viewer-stage" id="viewerStage">
    <iframe class="document-viewer-frame" id="docViewerIframe" title="Pre-Built Document Viewer"></iframe>
  </main>

  <!-- Load Manifest Generated by Exporter -->
  <script src="ppt_manifest.js"></script>

  <script>
    (function () {
      // 1. Parse Query Parameters
      const urlParams = new URLSearchParams(window.location.search);
      const modParam = urlParams.get('mod') || 'mod1';

      // 2. Authoritative Manifest Lookup (mod -> manifest entry -> PDF)
      const hasManifest = (typeof PPT_MANIFEST !== 'undefined' && PPT_MANIFEST);
      const manifestEntry = (hasManifest && PPT_MANIFEST[modParam])
        ? PPT_MANIFEST[modParam]
        : (hasManifest ? PPT_MANIFEST['mod1'] : null);

      if (!manifestEntry) {
        document.getElementById('navbarTitle').textContent = 'Presentation Not Found';
        document.title = 'Presentation Not Found — Presentation Viewer';
        return;
      }

      const pdfUrl = manifestEntry.pdfUrl;
      const displayTitle = manifestEntry.title || 'Presentation';
      const totalSlides = manifestEntry.slideCount || 0;
      const downloadName = manifestEntry.fileName || pdfUrl.split('/').pop();

      // 3. Set Navbar Title & Download Link
      document.getElementById('navbarTitle').textContent = displayTitle;
      document.title = `${displayTitle} — Presentation Viewer`;

      const downloadBtn = document.getElementById('btnDownload');
      downloadBtn.href = encodeURI(pdfUrl);
      downloadBtn.setAttribute('download', downloadName);

      if (totalSlides > 0) {
        document.getElementById('lblSlideBadge').textContent = `${totalSlides} Pages`;
      }

      // 4. Load Authoritative Viewer Frame
      const docViewerIframe = document.getElementById('docViewerIframe');
      docViewerIframe.src = `${encodeURI(pdfUrl)}#toolbar=1&navpanes=1`;

      // 5. Fullscreen Toggle
      const btnFullscreen = document.getElementById('btnFullscreen');
      btnFullscreen.addEventListener('click', () => {
        const stage = document.getElementById('viewerStage');
        if (!document.fullscreenElement) {
          stage.requestFullscreen?.().catch(() => {});
        } else {
          document.exitFullscreen?.().catch(() => {});
        }
      });
    })();
  </script>
</body>
</html>
